name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  WAILS_VERSION: v2.12.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: macos
          - os: windows-latest
            platform: windows/amd64
            artifact: windows
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 1.22.0 在新版 macOS 上编出的二进制缺少 LC_UUID，wails 会 Abort
          go-version: "1.23.x"

      - name: Add Git sh to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files\Git\bin"

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gcc pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Generate bindings
        run: wails generate module

      - name: Copy frontend bindings
        shell: bash
        run: sh frontend/build.sh

      - name: Build
        shell: bash
        run: |
          extra=()
          if [ "${{ runner.os }}" = "Linux" ]; then
            extra=(-tags webkit2_41)
          fi
          wails build -platform "${{ matrix.platform }}" -clean "${extra[@]}"

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist-out
          ls -la build/bin
          case "${{ runner.os }}" in
            macOS)
              app=$(find build/bin -maxdepth 1 -name '*.app' | head -n 1)
              tar -C build/bin -czf dist-out/termius-tools-darwin-universal.tar.gz "$(basename "$app")"
              ;;
            Windows)
              exe=$(find build/bin -maxdepth 1 -iname '*.exe' | head -n 1)
              cp "$exe" dist-out/termius-tools-windows-amd64.exe
              ;;
            Linux)
              bin=$(find build/bin -maxdepth 1 -type f ! -name '*.yaml' ! -name '*.yml' | head -n 1)
              cp "$bin" dist-out/termius-tools-linux-amd64
              chmod +x dist-out/termius-tools-linux-amd64
              ;;
          esac
          ls -la dist-out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termius-tools-${{ matrix.artifact }}
          path: dist-out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
